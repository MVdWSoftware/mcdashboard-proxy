stages: [test]

test:
  stage: test
  image: node:22
  services:
    - name: redis:7-alpine
      alias: redis
  variables:
    REDIS_URL: redis://redis:6379
    MCD_OPENAPI: contract/openapi.yaml
  script:
    - git clone --depth 1 "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/mcdashboard/mcdashboard-plugin.git" contract
    - corepack enable && pnpm install --frozen-lockfile
    - pnpm lint
    - pnpm build
    - pnpm test:coverage  # thresholds (100%) are in vitest.config.ts
    - pnpm audit --prod --audit-level high
  coverage: '/All files\s*\|\s*([\d.]+)/'
  artifacts:
    when: always
    paths: [coverage/]
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml
