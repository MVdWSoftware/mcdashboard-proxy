# Proxy + Redis. Put TLS in front (nginx, Caddy, Traefik, a cloud load balancer) and point
# UPSTREAM_URL at the Minecraft server's MCDashboard port.
services:
  proxy:
    build: .
    restart: unless-stopped
    ports: ["8080:8080"]            # public API; the admin port 9090 is not published
    environment:
      UPSTREAM_URL: http://host.docker.internal:1553
      UPSTREAM_LIVE_URL: http://host.docker.internal:1554
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379
      # Peers whose X-Forwarded-For is believed: your TLS terminator / CDN
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      # Optional: base64 contents of plugins/MCDashboard/secret.key, to reject bad tokens at the edge
      MCD_JWT_SECRET: ${MCD_JWT_SECRET:-}
      # Revocation feed: the plugin's events.token (proxy follows GET /v1/events), and/or a webhook receiver
      EVENTS_TOKEN: ${EVENTS_TOKEN:-}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      WEBHOOK_PORT: ${WEBHOOK_PORT:-0}
      WEBHOOK_HOST: 0.0.0.0             # inside the container; publish the port only to the Minecraft host if you use it
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on: [redis]
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru", "--save", ""]
