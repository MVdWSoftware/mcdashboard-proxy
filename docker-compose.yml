# Settings: docs/configuration.md. Put TLS in front of port 8080 (docs/deployment.md).
# Every variable below can be set in .env (see .env.example); the value after :- is the default.
# Builds from this checkout. The published image (ghcr.io/mvdwsoftware/mcdashboard-proxy) is an alternative;
# see docs/deployment.md#container-image.
services:
  proxy:
    build: .
    restart: unless-stopped
    # Only the public API; the admin port 9090 must never be published.
    ports: ["${LISTEN_PORT:-8080}:${LISTEN_PORT:-8080}"]
    environment:
      UPSTREAM_URL: ${UPSTREAM_URL:-http://host.docker.internal:1553}
      UPSTREAM_LIVE_URL: ${UPSTREAM_LIVE_URL:-http://host.docker.internal:1554}
      # The password is appended to this URL percent-encoded at startup (REDIS_PASSWORD), so it needs no escaping here
      # and may contain @ : / # or any other character.
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
      REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      MCD_JWT_SECRET: ${MCD_JWT_SECRET:-}
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
      TUNNEL_ALLOWED_IPS: ${TUNNEL_ALLOWED_IPS:-}
      TUNNEL_PATH: ${TUNNEL_PATH:-/tunnel}
      TUNNEL_DEAD_S: ${TUNNEL_DEAD_S:-60}
      EVENTS_TOKEN: ${EVENTS_TOKEN:-}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-}
      WEBHOOK_PORT: ${WEBHOOK_PORT:-0}
      # Inside the container only; if you publish the webhook port, allow the Minecraft host alone.
      WEBHOOK_HOST: ${WEBHOOK_HOST:-0.0.0.0}
      WEBHOOK_TOLERANCE_S: ${WEBHOOK_TOLERANCE_S:-300}
      REVOCATION_TTL_S: ${REVOCATION_TTL_S:-3600}
      LISTEN_HOST: ${LISTEN_HOST:-0.0.0.0}
      LISTEN_PORT: ${LISTEN_PORT:-8080}
      ADMIN_HOST: ${ADMIN_HOST:-127.0.0.1}
      ADMIN_PORT: ${ADMIN_PORT:-9090}
      LANGUAGES: ${LANGUAGES:-en,nl,fr,de,es}
      RATE_WINDOW_S: ${RATE_WINDOW_S:-60}
      RATE_READ: ${RATE_READ:-300}
      RATE_AUTH: ${RATE_AUTH:-10}
      RATE_WRITE: ${RATE_WRITE:-6}
      RATE_BAD_TOKEN: ${RATE_BAD_TOKEN:-20}
      MAX_CONCURRENT_PER_IP: ${MAX_CONCURRENT_PER_IP:-20}
      MAX_LIVE_PER_IP: ${MAX_LIVE_PER_IP:-5}
      MAX_LIVE_TOTAL: ${MAX_LIVE_TOTAL:-500}
      MAX_UPSTREAM_CONCURRENCY: ${MAX_UPSTREAM_CONCURRENCY:-32}
      UPSTREAM_TIMEOUT_MS: ${UPSTREAM_TIMEOUT_MS:-5000}
      MAX_BODY_BYTES: ${MAX_BODY_BYTES:-32768}
      MAX_URL_LENGTH: ${MAX_URL_LENGTH:-4096}
      STALE_IF_ERROR_S: ${STALE_IF_ERROR_S:-300}
      NEGATIVE_TTL_S: ${NEGATIVE_TTL_S:-5}
      CACHE_MAX_BODY_BYTES: ${CACHE_MAX_BODY_BYTES:-524288}
      MAX_CACHE_KEYS_PER_CLIENT: ${MAX_CACHE_KEYS_PER_CLIENT:-256}
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on: [redis]
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    # A config file keeps the password out of the process list (`ps`) and out of the compose file.
    # volatile-lru, not volatile-ttl: with the shortest TTL first, the rate-limit counters (60 s) would be evicted
    # before the cache entries they protect. LRU drops the coldest cache entry instead, and counters are hot.
    command:
      - sh
      - -c
      - |
        set -eu
        umask 077
        printf 'requirepass %s\nmaxmemory 128mb\nmaxmemory-policy volatile-lru\nsave ""\n' "$$REDIS_PASSWORD" > /tmp/redis.conf
        exec redis-server /tmp/redis.conf
