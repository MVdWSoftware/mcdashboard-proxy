name: Bug report (proxy)
description: Something in the MCDashboard proxy (the caching reverse proxy and tunnel endpoint) does not work as documented
labels: [bug, proxy]
body:
  - type: markdown
    attributes:
      value: |
        ## Scope: MCDashboard proxy (the caching reverse proxy and tunnel endpoint)
        This tracker is **only** for the MCDashboard proxy (the caching reverse proxy and tunnel endpoint).
        For the MCDashboard app, the portal (accounts, licences, billing), the website, the WordPress plugin or the Minecraft plugin itself, use https://mcdashboard.org/en/support/ or write to
        support@mcdashboard.org. Such issues may be closed without a reply.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This is about the MCDashboard proxy (the caching reverse proxy and tunnel endpoint), not the app, the portal or another connected service.
          required: true
        - label: I searched the existing issues and the docs.
          required: true
  - type: markdown
    attributes:
      value: |
        **Do not post secrets**: remove the TUNNEL_TOKEN, EVENTS_TOKEN, MCD_JWT_SECRET, WEBHOOK_SECRET and the Redis password from logs and config.
        Security problems go to security@mvdw-software.com, not here (see SECURITY.md).
  - type: input
    id: version
    attributes:
      label: Proxy version or image tag
    validations: { required: true }
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment
      options: [Docker, Docker Compose, Node.js directly, Other]
    validations: { required: true }
  - type: dropdown
    id: redis
    attributes:
      label: Redis
      options: ["No (in-memory)", "Yes"]
    validations: { required: true }
  - type: input
    id: plugin
    attributes:
      label: Plugin version
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations: { required: true }
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations: { required: true }
  - type: textarea
    id: logs
    attributes:
      label: Logs and relevant config
      description: Secrets removed, please.
      render: text
