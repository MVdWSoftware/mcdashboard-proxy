name: Issue bot tests
on:
  pull_request:
    paths: ['.github/scripts/**']
  push:
    branches: [main]
    paths: ['.github/scripts/**']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false }
      - run: node --test .github/scripts/issue-bot.test.cjs
