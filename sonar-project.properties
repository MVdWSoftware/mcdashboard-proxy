# SonarQube Community Build — project settings (server: https://sonar.mvdw-software.com).
# Analysis runs from mvdw/ci-templates sonar.yml on the default branch only.
# Token/server come from CI variables (SONAR_HOST_URL, SONAR_TOKEN), never from this file.
sonar.projectKey=mcdashboard-mcdashboard-proxy
sonar.projectName=mcdashboard proxy

sonar.sources=src
sonar.tests=.
sonar.test.inclusions=**/*.test.ts
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.d.ts

# The `test` job publishes the whole coverage/ directory (coverage.reporter includes lcov).
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Bootstrap: reads config and starts the server; only exercised by running the built binary, not by unit coverage.
sonar.coverage.exclusions=src/index.ts

# Sec-WebSocket-Accept is SHA-1 by RFC 6455 (typescript:S4790 in src/websocket.ts).
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S4790
sonar.issue.ignore.multicriteria.e1.resourceKey=src/websocket.ts

sonar.sourceEncoding=UTF-8
